[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nordwerk-close-lab"
version = "0.1.0"
description = "Deterministic smoke-test ledger for the NordWerk D+5 close lab"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.scripts]
nordwerk-close = "close_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
